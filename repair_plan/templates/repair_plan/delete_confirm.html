{% extends "common/base.html" %}

{% block content %}
<div class="container">
  <br>
  <form action="" method="POST" enctype='multipart/form-data'>
    <div class="content has-text-centered">
      <p>計画バージョン:【 {{ koujiname.version }} 】</p>
      <p>工事種類:【 {{ koujiname.kouji_type }} 】</p>
      <p>工事名:【 {{ koujiname.kouji_name }} 】</p>
      <button type="submit" class="button is-danger">削除する</button>
      <a class="button is-primary" href="javascript:void(0);" onclick="window.history.back();">戻る</a>
    </div>
    {% csrf_token %}
  </form>
</div>
{% endblock %}
