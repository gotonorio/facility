  # 設備台帳
services:
  facility:
    build:
      context: ./
      dockerfile: Dockerfile.prod
    # image名:タグ
    image: facility
    # 起動ユーザを指定する
    user: "${UID}:${GID}"
    # container名
    container_name: facility
    restart: always
    # ホスト上のfacility/ディレクトリをcode/としてコンテナにマウントする。
    volumes:
      - ../:/code
    # 環境変数TZを設定。
    environment:
      TZ: "Asia/Tokyo"
    # 本番環境 コンテナネットワークだけにポートを公開する場合はexposeするだけ。
    expose:
      - "8300"
    # 共有ネットワークに繋げる。(ネットワークを調べるのは、docker network ls)
    networks:
      - sophiag-network
 
    command: /usr/local/bin/gunicorn facility.wsgi:application -w 2 -b :8300
    
networks:
  sophiag-network:
    external: true
