# 通帳監査システム
services:
  facility:
    # 相対パスでDockerfileのpathを指定。
    # contextは一つ上の階層なので、Dockerfileの指定はcontextで指定した階層からのpathになる。
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # image名:タグ
    image: facility
    # 起動ユーザを指定する
    user: "${UID}:${GID}"
    # container名
    container_name: facility
    restart: unless-stopped

    # ここで指定した中身が、OSの環境変数としてDjangoに渡される（settings.pyで読み込む）
    # 機密ファイル（.env）の配置場所を相対パスで指定
    env_file:
      - ../.env

    # DockerfileのCOPYコマンドで（.djangoignoreで除外した以外の）ファイルを/code/にコピー済み。
    # ホスト上のcollectstaticで作成されたstaticディレクトリを/code/staticとしてマウントする。
    #     settings.pyで STATIC_ROOT = "/code/static"としている
    #     /codeはDockerfileでWORKDIRとしている
    # ホスト上のpb_audit.sqlite3を/code/fac.sqlite3としてマウントする。
    volumes:
      - ../static:/code/static
      - ../fac.sqlite3:/code/fac.sqlite3
      # ホストのoutputs/shared_data/facility_dataを、コンテナ内の/code/outputs/にマウントする。
      # ホストにはoutputs/shared_data/facility_dataが存在している必要がある。
      - /home/sophiag_master/bulma/opt/shared_data/facility_data:/code/outputs

    # 環境変数TZを設定。
    environment:
      TZ: "Asia/Tokyo"
      APP_ENV: "product"

    # --------------------------------------------
    # 本番環境 コンテナネットワークだけにポートを公開する場合はexposeするだけ。
    # --------------------------------------------
    expose:
      - "8300"
    # 共有ネットワークに繋げる。(ネットワークを調べるのは、docker network ls)
    networks:
      - sophiag-network
 
    command: /usr/local/bin/gunicorn facility.wsgi:application --workers 1 --threads 4 --bind :8300

networks:
  sophiag-network:
    external: true
