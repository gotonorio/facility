{% extends "base.html" %}
{% block content %}
<div class="container is-fluid">
  <div class="content">
    <h2>本当に削除しますか？</h2>
    <div class="has-text-danger is-size-5">{{ object.koujimei }}</div> を削除しようとしています。
    </div>

    <form method="post">
      {% csrf_token %}
      <br>
      <button type="submit" class="button is-primary is-size-7">削除</button>
      <a class="button is-info is-size-7" href="javascript:void(0);" onclick="window.history.back();">キャンセル</a>
    </form>
  </div>
</div>
{% endblock content %}
