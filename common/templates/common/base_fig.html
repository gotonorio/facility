{% load static %}
<!DOCTYPE html>
{% comment %} <html class="has-navbar-fixed-top" lang="ja"> {% endcomment %}
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# favicon #}
  <link rel="icon" type="image/svg+xml" href="{% static 'common/favicon.svg' %}">
  <link rel="icon" href="{% static 'common/favicon.ico' %}" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'common/apple-touch-icon.png' %}">
  {% comment %} <link rel="shortcut icon" type="image/png" href="{{STATIC_URL}}/static/favicon.ico"/>
  <link rel="apple-touch-icon-precomposed" href="{{STATIC_URL}}/static/apple-touch-icon-precomposed.png"> {% endcomment %}
  {# css #}
  <link href="{% static 'common/mycss/mycss.css' %}" rel="stylesheet">
  <title>
  {% block title %}
    設備管理
  {% endblock %}
  </title>
  {% block head %}
  {% endblock %}
</head>
<body>
  <main>
  {% block content %}
  {% endblock %}
  </main>
</body>
</html>
